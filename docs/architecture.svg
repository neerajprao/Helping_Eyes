<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
<rect width="1500" height="930" fill="#ffffff"/>
<text x="750" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Helping Eyes: life cycle of a request</text>
<rect x="30" y="70" width="700" height="675" rx="14" fill="#eff6ff" stroke="#9ca3af"/>
<text x="380.0" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Camera path</text>
<rect x="770" y="70" width="700" height="675" rx="14" fill="#fff7ed" stroke="#9ca3af"/>
<text x="1120.0" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Voice / typing path</text>
<rect x="210" y="105" width="320" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="370.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">INPUT 1: camera (or its shutter button)</text>
<text x="370.0" y="145.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">or an uploaded photo</text>
<rect x="210" y="190" width="320" height="80" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="370.0" y="205.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">vision.py, part D (the coach)</text>
<text x="370.0" y="225.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">looks for text, checks blur and glare</text>
<text x="370.0" y="245.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">a sheet that fills the picture is close enough</text>
<text x="370.0" y="265.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">(uploads: shown on the photo too)</text>
<rect x="45" y="190" width="140" height="84" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="115.0" y="207.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Hint</text>
<text x="115.0" y="227.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">left, right, hold still,</text>
<text x="115.0" y="247.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">move closer only</text>
<text x="115.0" y="267.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">if text is unclear</text>
<rect x="160" y="330" width="240" height="50" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280.0" y="350.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Full photo</text>
<text x="280.0" y="370.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">normal mode: text is steady</text>
<rect x="160" y="420" width="240" height="60" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280.0" y="445.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">vision.py, part B</text>
<text x="280.0" y="465.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">fix tilt, glare, shadows</text>
<rect x="160" y="520" width="240" height="60" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="280.0" y="545.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">vision.py, part A</text>
<text x="280.0" y="565.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">picture to text (Apple Vision)</text>
<rect x="440" y="330" width="260" height="50" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="570.0" y="350.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Full photo of the page</text>
<text x="570.0" y="370.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">book mode: a page was turned</text>
<rect x="440" y="420" width="260" height="118" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="570.0" y="444.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">vision.py, part C (book mode)</text>
<text x="570.0" y="464.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">split pages if a spine is found,</text>
<text x="570.0" y="484.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">page number, paragraph order,</text>
<text x="570.0" y="504.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">AI groups the lines, sidebars last,</text>
<text x="570.0" y="524.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">a nudge is not a page turn</text>
<rect x="440" y="550" width="260" height="55" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="570.0" y="572.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Page text</text>
<text x="570.0" y="592.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">+ where each word is</text>
<rect x="210" y="665" width="320" height="60" rx="8" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="370.0" y="690.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Captured text</text>
<text x="370.0" y="710.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">saved for questions</text>
<rect x="800" y="105" width="290" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="945.0" y="135.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">INPUT 2: your voice or typing</text>
<rect x="800" y="195" width="290" height="60" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="945.0" y="230.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Browser: speech to text</text>
<rect x="800" y="285" width="290" height="70" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="945.0" y="305.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">commands.py</text>
<text x="945.0" y="325.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">command or question?</text>
<text x="945.0" y="345.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">unclear wording: the AI decides</text>
<rect x="1180" y="295" width="260" height="60" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="1310.0" y="320.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Do it</text>
<text x="1310.0" y="340.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">stop, repeat, next, book mode</text>
<rect x="800" y="420" width="290" height="100" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="945.0" y="445.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">assistant.py + the chosen AI model</text>
<text x="945.0" y="465.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">Gemini (online) or Qwen 3B (Ollama)</text>
<text x="945.0" y="485.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">answers only from the saved text</text>
<text x="945.0" y="505.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">(book mode: also groups the lines)</text>
<rect x="1180" y="420" width="260" height="90" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="1310.0" y="450.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">DuckDuckGo search</text>
<text x="1310.0" y="470.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">then the AI answers from</text>
<text x="1310.0" y="490.0" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">the results</text>
<rect x="800" y="575" width="640" height="55" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="1120.0" y="597.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Answer, sentence by sentence</text>
<text x="1120.0" y="617.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">each sentence goes to the voice (commands.py: local Kokoro voice)</text>
<rect x="30" y="800" width="1440" height="95" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="750.0" y="832.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">OUTPUT: spoken aloud and shown on screen</text>
<text x="750.0" y="852.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">spoken by the local Kokoro voice (on this Mac); backups: Edge voice, then the browser voice</text>
<text x="750.0" y="872.5" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">(book mode also highlights the word being read)</text>
