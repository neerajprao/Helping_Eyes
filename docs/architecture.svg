<text x="716" y="640" text-anchor="middle" font-size="12" fill="#374151" stroke="#fff" stroke-width="4" paint-order="stroke">read the page</text>
<path d="M945,155 L945,195" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M945,255 L945,285" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M945,355 L945,420" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
<text x="985" y="392" text-anchor="middle" font-size="12" fill="#374151" stroke="#fff" stroke-width="4" paint-order="stroke">question</text>
